name: Publish Bali trip
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'package*.json', 'scripts/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: bali-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Require the independent data service
        env:
          VITE_TRIP_API_URL: ${{ vars.VITE_TRIP_API_URL }}
        run: |
          node --input-type=module -e "const url=new URL(process.env.VITE_TRIP_API_URL); if(url.protocol!=='https:'||url.hostname.endsWith('chatgpt.site')) throw Error('Configure an independent HTTPS trip API');"
          curl --fail --silent --show-error --max-time 20 "${VITE_TRIP_API_URL%/}/health"
      - name: Prepare self-hosted Bali map
        run: python3 scripts/prepare-map.py
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_MAP_RELEASE: '1'
      - run: npm run build
        env:
          VITE_TRIP_API_URL: ${{ vars.VITE_TRIP_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
