<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#e9f8ff">
<title>旅行网页 · 访问测试</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:linear-gradient(160deg,#dff6ff 0%,#f8fcff 48%,#fff 100%);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172b37;padding:calc(32px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));display:grid;place-items:center}main{width:100%;max-width:440px}.label{font-size:13px;letter-spacing:.12em;color:#517283}h1{font-size:34px;letter-spacing:-.03em;line-height:1.3;margin:20px 0 12px}p{margin:0 0 24px;color:#587181}.checks{padding:12px 20px;background:#fff;border:1px solid #dceaf0;border-radius:24px;box-shadow:0 18px 50px #16384808}.check{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0}.check+.check{border-top:1px solid #edf3f6}.check span{color:#648090}.check strong{font-weight:600;text-align:right}.ok{color:#087651}.pending{color:#8a610c}button{margin-top:24px;width:100%;min-height:54px;border:0;border-radius:99px;background:#152d3c;color:white;font:inherit;font-weight:600;padding:14px 20px;cursor:pointer}button:focus-visible{outline:3px solid #12a9ed;outline-offset:4px}#action-result{min-height:28px;margin-top:12px;text-align:center;color:#087651}.note{font-size:14px;margin-top:20px;color:#648090}footer{font-size:12px;color:#7893a1;margin-top:28px}
</style></head>
<body><main>
<div class="label">BALI · CONNECTION CHECK</div><h1>页面已打开</h1>
<p>这是旅行网页的新入口测试。请在微信内点击下方按钮，确认页面可以正常使用。</p>
<section class="checks" aria-label="访问检查结果">
<div class="check"><span>网页访问</span><strong class="ok">正常</strong></div>
<div class="check"><span>页面交互</span><strong id="script-status" class="pending">等待检查</strong></div>
<div class="check"><span>测试文件</span><strong id="file-status" class="pending" aria-live="polite">正在检查</strong></div>
</section>
<button id="test-button" type="button">点击测试按钮</button><div id="action-result" role="status" aria-live="polite"></div>
<p class="note">此页仅用于检查新地址的访问情况，不含旅行资料。完整行程与共同编辑功能尚未迁移。</p>
<noscript><p>当前浏览器未运行页面脚本，请将此提示反馈给我。</p></noscript><footer>访问测试 · 2026.09.24</footer>
</main><script>
const scriptStatus=document.getElementById('script-status');scriptStatus.textContent='脚本已加载';scriptStatus.className='ok';
document.getElementById('test-button').addEventListener('click',()=>{scriptStatus.textContent='点击响应正常';document.getElementById('action-result').textContent='按钮响应正常，可以把这个结果告诉我。';});
const fileStatus=document.getElementById('file-status');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
fetch('./health.json',{cache:'no-store',signal:controller.signal}).then(async response=>{if(!response.ok)throw new Error('File unavailable');const result=await response.json();if(result.check!=='bali-access-20260924')throw new Error('Unexpected response');fileStatus.textContent='读取正常';fileStatus.className='ok';}).catch(()=>{fileStatus.textContent='暂未读取成功';}).finally(()=>clearTimeout(timer));
</script></body></html>
